<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue English Journal</title>
  
  <link rel="apple-touch-icon" href="https://via.placeholder.com/180/2563eb/ffffff?text=Blue">
  <meta name="theme-color" content="#2563eb">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #2563eb; font-size: 24px; text-align: center; margin-bottom: 20px; }
    
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #1e3a8a; }

    .api-key-box { display: flex; gap: 8px; margin-bottom: 15px; }
    .api-key-box input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    
    textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; resize: vertical; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    
    button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background: #2563eb; color: white; width: 100%; padding: 12px; font-size: 16px; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #22c55e; color: white; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }

    .result-box { background: #f1f5f9; border-radius: 8px; padding: 15px; min-height: 120px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
    .audio-controls { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
    audio { width: 100%; margin-top: 8px; }
    
    .phrase-input { display: flex; gap: 8px; margin-bottom: 12px; }
    .phrase-input input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .phrase-list { list-style: none; padding: 0; margin: 0; }
    .phrase-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📘 Blue English Journal</h1>

  <div class="card">
    <div class="card-title">🔑 Gemini API Key</div>
    <div class="api-key-box">
      <input type="password" id="apiKeyInput" placeholder="API Key를 입력하면 저장됩니다">
      <button class="btn-secondary" onclick="saveApiKey()">저장</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">✍️ Today's Journal (쓰기 & 말하기)</div>
    <textarea id="journalInput" placeholder="오늘의 일기를 영문으로 적거나 말해보세요..."></textarea>
    
    <div class="btn-group">
      <button id="sttBtn" class="btn-secondary" onclick="toggleSTT()">🎙️ 음성으로 입력 시작</button>
      <button id="recBtn" class="btn-danger" onclick="toggleRecord()">🔴 내 발음 녹음하기</button>
    </div>
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <div style="margin-top: 15px;">
      <button id="submitBtn" class="btn-primary" onclick="getAIFeedback()">Submit & Get Feedback</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">💡 AI Feedback</div>
    <div id="resultBox" class="result-box">일기를 작성한 후 제출하면 교정 결과가 표시됩니다.</div>
    
    <div class="audio-controls">
      <span>🔊 재생 속도:</span>
      <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1.0" style="width: 100px;">
      <span id="rateVal">1.0x</span>
      <button class="btn-secondary" onclick="speakResult()">🔊 원어민 음성 듣기</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📂 My Phrase Book (나만의 표현 상자)</div>
    <div class="phrase-input">
      <input type="text" id="manualPhrase" placeholder="저장하고 싶은 표현 직접 입력...">
      <button class="btn-secondary" onclick="addPhraseManual()">+ 추가</button>
    </div>
    <ul id="phraseList" class="phrase-list"></ul>
  </div>
</div>

<script>
  let apiKey = localStorage.getItem('gemini_api_key') || '';
  if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (key) {
      localStorage.setItem('gemini_api_key', key);
      apiKey = key;
      alert('API Key가 저장되었습니다!');
    }
  }

  async function getAIFeedback() {
    if (!apiKey) return alert('상단에 Gemini API Key를 먼저 저장해 주세요.');
    const text = document.getElementById('journalInput').value.trim();
    if (!text) return alert('일기 내용을 입력해 주세요.');

    const btn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    
    btn.disabled = true;
    btn.textContent = 'AI 분석 중...';
    resultBox.innerText = 'AI가 일기를 읽고 교정을 진행하고 있습니다...';

    const promptText = `Analyze this journal entry: "${text}".
Provide:
1. Two natural corrected versions.
2. Short emotional reflection or nuance explanation in Korean (3-4 lines).
3. Useful expanded daily expressions.`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();

      if (data.error) {
        if (data.error.code === 429 || data.error.message.includes('quota')) {
          throw new Error('API 사용량 초과입니다. 약 15~20초 후 다시 시도해 주세요.');
        }
        throw new Error(data.error.message || 'API 호출 중 오류 발생');
      }

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        resultBox.innerText = data.candidates[0].content.parts[0].text;
      } else {
        resultBox.innerText = '응답을 불러올 수 없습니다. 다시 시도해 주세요.';
      }
    } catch (err) {
      resultBox.innerText = '오류 발생: ' + err.message;
    } finally {
      // 연속 클릭 방지: 제출 완료 후 5초 동안 버튼 비활성화 유지
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Submit & Get Feedback';
      }, 5000);
    }
  }

  // STT / 녹음 / 음성합성 기능
  let recognition, isRecognizing = false;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById('journalInput').value += ' ' + transcript;
    };
  }

  function toggleSTT() {
    if (!recognition) return alert('이 브라우저는 음성 인식을 지원하지 않습니다.');
    const btn = document.getElementById('sttBtn');
    if (isRecognizing) {
      recognition.stop();
      btn.textContent = '🎙️ 음성으로 입력 시작';
      isRecognizing = false;
    } else {
      recognition.start();
      btn.textContent = '⏹️ 음성 인식 중지';
      isRecognizing = true;
    }
  }

  let mediaRecorder, audioChunks = [];
  async function toggleRecord() {
    const btn = document.getElementById('recBtn');
    const player = document.getElementById('audioPlayer');

    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      btn.textContent = "🔴 내 발음 녹음하기";
      btn.className = "btn-danger";
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        player.src = URL.createObjectURL(audioBlob);
        player.style.display = "block";
      };
      mediaRecorder.start();
      btn.textContent = "⏹️ 녹음 중지 및 저장";
      btn.className = "btn-success";
    } catch (err) {
      alert("마이크 사용 권한을 허용해 주세요.");
    }
  }

  document.getElementById('speechRate').addEventListener('input', (e) => {
    document.getElementById('rateVal').textContent = e.target.value + 'x';
  });

  function speakResult() {
    const text = document.getElementById('resultBox').innerText;
    if (!text) return;
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = parseFloat(document.getElementById('speechRate').value);
    utterance.lang = 'en-US';

    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.includes('en'));
    if (enVoice) utterance.voice = enVoice;

    window.speechSynthesis.speak(utterance);
  }

  // 단어장 관리
  let phrases = JSON.parse(localStorage.getItem('my_phrases') || '[]');
  function renderPhrases() {
    const list = document.getElementById('phraseList');
    list.innerHTML = phrases.map((p, i) => `
      <li class="phrase-item">
        <span>${p}</span>
        <button class="btn-secondary" style="padding: 4px 8px;" onclick="deletePhrase(${i})">삭제</button>
      </li>
    `).join('');
  }

  function addPhraseManual() {
    const input = document.getElementById('manualPhrase');
    if (input.value.trim()) {
      phrases.push(input.value.trim());
      localStorage.setItem('my_phrases', JSON.stringify(phrases));
      input.value = '';
      renderPhrases();
    }
  }

  function deletePhrase(i) {
    phrases.splice(i, 1);
    localStorage.setItem('my_phrases', JSON.stringify(phrases));
    renderPhrases();
  }
  renderPhrases();
</script>

</body>
</html>
