<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue English Journal</title>
  
  <link rel="apple-touch-icon" href="https://dummyimage.com/180x180/2563eb/ffffff.png&text=📘+Blue">
  <link rel="icon" href="https://dummyimage.com/180x180/2563eb/ffffff.png&text=📘+Blue">
  <meta name="theme-color" content="#2563eb">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 12px; font-size: 19px; line-height: 1.6; }
    .container { max-width: 100%; margin: 0 auto; }
    h1 { color: #2563eb; font-size: 28px; text-align: center; margin-top: 10px; margin-bottom: 20px; font-weight: 800; }
    
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .card-title { font-size: 22px; font-weight: bold; margin-bottom: 14px; color: #1e3a8a; }

    .api-key-box { display: flex; gap: 8px; margin-bottom: 10px; }
    .api-key-box input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 18px; }
    .api-key-box button { shrink: 0; white-space: nowrap; font-size: 18px; padding: 14px 18px; }

    textarea { width: 100%; height: 160px; padding: 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 20px; line-height: 1.6; resize: vertical; margin-bottom: 12px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    
    button { padding: 14px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 18px; }
    .btn-primary { background: #2563eb; color: white; width: 100%; padding: 16px; font-size: 21px; font-weight: 800; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #22c55e; color: white; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }

    /* AI Feedback 시원하게 확대한 결과 영역 */
    .result-box { background: #f1f5f9; border-radius: 10px; padding: 20px; min-height: 140px; font-size: 20px; line-height: 1.8; color: #0f172a; word-break: break-word; }
    .result-box h3 { margin-top: 22px; margin-bottom: 10px; color: #2563eb; font-size: 23px; font-weight: 800; border-bottom: 3px solid #cbd5e1; padding-bottom: 6px; }
    .result-box p { margin: 10px 0; }
    .result-box ul { padding-left: 24px; margin: 10px 0; }
    .result-box li { margin-bottom: 10px; }

    .audio-controls { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 18px; }
    audio { width: 100%; margin-top: 10px; }
    
    .phrase-input { display: flex; gap: 8px; margin-bottom: 12px; }
    .phrase-input input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 18px; }
    .phrase-list { list-style: none; padding: 0; margin: 0; }
    .phrase-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; font-size: 18px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📘 Blue English Journal</h1>

  <div class="card">
    <div class="card-title">🔑 Gemini API Key</div>
    <div class="api-key-box">
      <input type="password" id="apiKeyInput" placeholder="API Key 입력 후 저장">
      <button class="btn-secondary" onclick="saveApiKey()">저장</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">✍️ Today's Journal</div>
    <textarea id="journalInput" placeholder="오늘의 일기를 영문으로 적거나 말해보세요..."></textarea>
    
    <div class="btn-group">
      <button id="sttBtn" class="btn-secondary" onclick="toggleSTT()">🎙️ 음성으로 입력 시작</button>
      <button id="recBtn" class="btn-danger" onclick="toggleRecord()">🔴 내 발음 녹음하기</button>
    </div>
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <div style="margin-top: 12px;">
      <button id="submitBtn" class="btn-primary" onclick="getAIFeedback()">Submit & Get Feedback</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">💡 AI Feedback</div>
    <div id="resultBox" class="result-box">일기를 작성한 후 제출하면 한국어 교정 결과가 표시됩니다.</div>
    
    <div class="audio-controls">
      <div>
        <span>속도:</span>
        <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1.0" style="width: 90px; height: 20px;">
        <span id="rateVal">1.0x</span>
      </div>
      <button class="btn-secondary" onclick="speakResult()">🔊 원어민 음성 듣기</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📂 My Phrase Book</div>
    <div class="phrase-input">
      <input type="text" id="manualPhrase" placeholder="저장할 표현 입력...">
      <button class="btn-secondary" onclick="addPhraseManual()">+ 추가</button>
    </div>
    <ul id="phraseList" class="phrase-list"></ul>
  </div>
</div>

<script>
  let apiKey = localStorage.getItem('gemini_api_key') || '';
  if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (key) {
      localStorage.setItem('gemini_api_key', key);
      apiKey = key;
      alert('API Key가 저장되었습니다!');
    }
  }

  function formatMarkdown(text) {
    let formatted = text
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h3>$1</h3>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/^- (.*$)/gim, '<li>$1</li>')
      .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
      .replace(/\n\n/g, '<br>')
      .replace(/\n/g, '<br>');
    return formatted;
  }

  async function getAIFeedback() {
    if (!apiKey) return alert('상단에 Gemini API Key를 먼저 저장해 주세요.');
    const text = document.getElementById('journalInput').value.trim();
    if (!text) return alert('일기 내용을 입력해 주세요.');

    const btn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    
    btn.disabled = true;
    btn.textContent = 'AI 분석 중...';
    resultBox.innerHTML = 'AI가 일기를 읽고 한국어로 교정 피드백을 작성하고 있습니다...';

    const promptText = `사용자가 작성한 영어 일기/문장: "${text}"

위 문장을 분석하여 반드시 한국어로 친절하게 피드백을 제공해 주세요.

구조는 다음과 같이 작성해 주세요:
### 1. 자연스러운 영어 교정 문장
- 교정 버전 1 (기본 및 정중한 표현)
- 교정 버전 2 (자연스러운 구어체 표현)

### 2. 문장 뉘앙스 및 감정 피드백 (한국어 설명)
- 작성한 문장의 어조, 문법적 포인트, 느낌에 대한 따뜻하고 상세한 한국어 설명 (3~4줄)

### 3. 알아두면 유용한 일상 표현 (한국어 설명)
- 작성한 내용과 관련된 유용한 영어 표현 2~3개와 그에 대한 한국어 뜻 설명`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();

      if (data.error) {
        if (data.error.code === 429 || data.error.message.includes('quota')) {
          throw new Error('API 사용량 초과입니다. 약 15~20초 후 다시 시도해 주세요.');
        }
        throw new Error(data.error.message || 'API 호출 중 오류 발생');
      }

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const rawText = data.candidates[0].content.parts[0].text;
        resultBox.innerHTML = formatMarkdown(rawText);
      } else {
        resultBox.innerText = '응답을 불러올 수 없습니다. 다시 시도해 주세요.';
      }
    } catch (err) {
      resultBox.innerText = '오류 발생: ' + err.message;
    } finally {
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Submit & Get Feedback';
      }, 3000);
    }
  }

  // STT / 녹음 기능
  let recognition, isRecognizing = false;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById('journalInput').value += ' ' + transcript;
    };
  }

  function toggleSTT() {
    if (!recognition) return alert('현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome이나 Safari 앱에서 접속해 주세요.');
    const btn = document.getElementById('sttBtn');
    if (isRecognizing) {
      recognition.stop();
      btn.textContent = '🎙️ 음성으로 입력 시작';
      isRecognizing = false;
    } else {
      try {
        recognition.start();
        btn.textContent = '⏹️ 음성 인식 중지';
        isRecognizing = true;
      } catch (e) {
        alert('마이크 사용 권한을 확인해 주세요.');
      }
    }
  }

  let mediaRecorder, audioChunks = [];
  async function toggleRecord() {
    const btn = document.getElementById('recBtn');
    const player = document.getElementById('audioPlayer');

    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      btn.textContent = "🔴 내 발음 녹음하기";
      btn.className = "btn-danger";
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        player.src = URL.createObjectURL(audioBlob);
        player.style.display = "block";
      };
      mediaRecorder.start();
      btn.textContent = "⏹️ 녹음 중지 및 저장";
      btn.className = "btn-success";
    } catch (err) {
      alert("마이크 사용 권한을 허용해 주세요.");
    }
  }

  document.getElementById('speechRate').addEventListener('input', (e) => {
    document.getElementById('rateVal').textContent = e.target.value + 'x';
  });

  function speakResult() {
    const text = document.getElementById('resultBox').innerText;
    if (!text) return;
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = parseFloat(document.getElementById('speechRate').value);
    utterance.lang = 'en-US';

    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.includes('en'));
    if (enVoice) utterance.voice = enVoice;

    window.speechSynthesis.speak(utterance);
  }

  // 단어장 관리
  let phrases = JSON.parse(localStorage.getItem('my_phrases') || '[]');
  function renderPhrases() {
    const list = document.getElementById('phraseList');
    list.innerHTML = phrases.map((p, i) => `
      <li class="phrase-item">
        <span>${p}</span>
        <button class="btn-secondary" style="padding: 8px 12px; font-size: 16px;" onclick="deletePhrase(${i})">삭제</button>
      </li>
    `).join('');
  }

  function addPhraseManual() {
    const input = document.getElementById('manualPhrase');
    if (input.value.trim()) {
      phrases.push(input.value.trim());
      localStorage.setItem('my_phrases', JSON.stringify(phrases));
      input.value = '';
      renderPhrases();
    }
  }

  function deletePhrase(i) {
    phrases.splice(i, 1);
    localStorage.setItem('my_phrases', JSON.stringify(phrases));
    renderPhrases();
  }
  renderPhrases();
</script>

</body>
</html>
